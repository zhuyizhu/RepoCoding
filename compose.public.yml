# Optional HTTPS and password gate for a domain pointing to this host.
services:
  public:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - path: ./deployment/public.env
        format: raw
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
